<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-left">
            <h1>🎯 JobHunter AI</h1>
            <p>Find Smarter. Apply Faster.</p>
        </div>
        <div class="header-right">
            <button id="update-button">
                Actualizar empleos
            </button>
        </div>
    </header>
    <main>
        <section id="search">
            <input id="search-input" type="text" placeholder="Buscar por puesto, empresa o tecnología...">
        </section>
        <section id="dashboard">
            <div class="stat-card" id="jobs-card">
                <div class="stat-icon">📄</div>
                <div class="stat-number" id="total-jobs">    
                </div>
                <div class="stat-title">
                    Empleos encontrados
                </div>
                <div class="stat-sort">
                    Ordenar por:
                </div>
            </div>
            <div class="stat-card" id="companies-card">
                <div class="stat-icon">🏢</div>
                <div class="stat-number" id="total-companies">      
                </div>
                <div class="stat-title">
                    Empresas
                </div>
            </div>
            <div class="stat-card" id="sources-card">
                <div class="stat-icon">🌐</div>
                <div class="stat-number" id="total-sources">     
                </div>
                <div class="stat-title">
                    Fuentes Activas
                </div>
            </div>
            <div class="stat-card" id="new-jobs-card">
                <div class="stat-icon">✨</div>
                <div class="stat-number" id="jobs-added">  
                </div>
                <div class="stat-title">
                    Nuevos empleos añadidos
                </div>
                <div class="stat-time" id="last-update">
                </div>
            </div>
        </section>
        <button id="back-to-all-jobs" class="back-to-all-jobs" style="display: none;">
            Volver a todos los empleos
        </button>
        <div id="results-info">
            <span id="results-count">
                Cargando empleos ...
            </span>
        <section id="active-filters">
             <div class="filter-chip">🏢 Datadog
                <button>✕</button>
            </div>
            <div class="filter-chip">🌐 RemoteOK
                <button>✕</button>
            </div>
        </section>
        <button id="favorites-button" class="favorites-button">
                ♡ Favoritos
            </button>
        </div>
        <section id="jobs"></section>
        <section id="pagination" class="pagination"></section>
        <aside id="assistant"></aside>
    </main>
</body>
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/filters.js"></script>
<script src="js/dropdown.js"></script>
<script src="js/jobs.js"></script>
<script src="js/activeFilters.js"></script>
<script src="js/update.js"></script>
<script src="js/app.js"></script>

</html>
